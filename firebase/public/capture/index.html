<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo to 3D Asset</title>
  <!-- Starter capture app wired to Firebase. Restyle freely: the Firebase logic is all in app.js. -->
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <style>
    :root { --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #667085; --line: #d9dde5; --accent: #2563eb; --bad: #c0362c; --good: #15803d; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11141a; --card: #1a1f28; --text: #e6e9ef; --muted: #98a2b3; --line: #2c3340; --accent: #6b9cff; --bad: #ff7b70; --good: #4ade80; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 4px 0 2px; }
    .muted { color: var(--muted); font-size: 13px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 14px; }
    label { display: block; font-weight: 600; margin: 10px 0 6px; }
    input[type=file], select { width: 100%; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
    .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
    button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 6px 10px; font-size: 13px; margin-top: 6px; }
    button:disabled { opacity: .5; cursor: default; }
    details { margin-top: 12px; }
    summary { cursor: pointer; font-weight: 600; }
    .views label { font-weight: 400; }
    #preview { max-width: 100%; max-height: 240px; border-radius: 8px; margin-top: 10px; display: none; }
    #msg { margin-top: 10px; min-height: 1.4em; }
    .bad { color: var(--bad); } .good { color: var(--good); }
    .job { padding: 12px 0; border-top: 1px solid var(--line); }
    .job:first-child { border-top: 0; }
    .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 6px 0; }
    .bar div { height: 100%; background: var(--accent); transition: width .4s; }
    .files a { margin-right: 10px; font-size: 13px; color: var(--accent); overflow-wrap: anywhere; }
    model-viewer { width: 100%; height: 280px; background: var(--bg); border-radius: 8px; margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <h1>Photo to 3D Asset</h1>
  <div class="muted" id="mode">Connecting…</div>

  <form class="card" id="form">
    <label for="photo-front">Front photo</label>
    <input id="photo-front" type="file" accept="image/*" capture="environment" required>
    <img id="preview" alt="Selected photo">
    <details>
      <summary>More angles (optional, better shape)</summary>
      <div class="muted">Keep the object still and the same distance away. Walk around it a quarter turn at a time.</div>
      <div class="views">
        <label>Left side <span class="muted">(the object's left: step to your right)</span>
          <input id="photo-left" type="file" accept="image/*" capture="environment"></label>
        <label>Back
          <input id="photo-back" type="file" accept="image/*" capture="environment"></label>
        <label>Right side <span class="muted">(the object's right: step to your left)</span>
          <input id="photo-right" type="file" accept="image/*" capture="environment"></label>
      </div>
    </details>
    <label for="category">Category</label>
    <select id="category">
      <option value="auto">Auto (let the classifier decide)</option>
      <option value="prop">Prop (static object, no rig)</option>
      <option value="character">Character (gets a skeleton)</option>
      <option value="creature">Creature (animal/monster, gets a skeleton)</option>
    </select>
    <div class="row">
      <input id="force" type="checkbox">
      <label for="force" style="margin:0;font-weight:400">Skip blur/lighting check</label>
    </div>
    <div class="row"><button id="submit" disabled>Upload &amp; generate</button></div>
    <div id="msg" role="status"></div>
  </form>

  <section class="card">
    <strong>Your jobs</strong>
    <div id="jobs"><div class="muted">No jobs yet.</div></div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
